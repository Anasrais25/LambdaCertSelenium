# .gitpod.yml
image: gitpod/workspace-dotnet

tasks:
  - init: |
      echo "Checking .NET SDK..."
      if ! command -v dotnet &> /dev/null; then
        echo "Installing .NET SDK (8.0)..."
        wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --channel 8.0
        echo 'export PATH=$PATH:$HOME/.dotnet' >> ~/.bashrc
        export PATH=$PATH:$HOME/.dotnet
      else
        echo ".NET SDK already installed."
      fi

      echo "Using .NET version:"
      dotnet --version

      echo "Restoring NuGet packages..."
      dotnet restore src/SeleniumCSharpSample/SeleniumCSharpSample.sln

  - command: |
      echo "Ensuring .NET is in PATH..."
      export PATH=$PATH:$HOME/.dotnet

      echo "Loading environment variables from .env file..."
      if [ -f .env ]; then
        export $(cat .env | xargs)
      fi

      echo "Building project..."
      dotnet build src/SeleniumCSharpSample/SeleniumCSharpSample.sln

      echo "Running tests on LambdaTest Grid..."
      mkdir -p test-results
      dotnet test src/SeleniumCSharpSample/SeleniumCSharpSample.sln \
        --logger "trx;LogFileName=test_results.trx" \
        /p:CollectCoverage=false \
        | tee test-results/session_ids.txt
- name: Run Selenium Tests
    command: |
      echo "LT_USERNAME=$LT_USERNAME"
      echo "LT_ACCESS_KEY=$LT_ACCESS_KEY"
      dotnet test src/SeleniumCSharpSample/SeleniumCSharpSample.csproj
vscode:
  extensions:
    - ms-dotnettools.csharp
